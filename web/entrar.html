<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audasys Canvas — Entrar</title>
<link rel="stylesheet" href="style.css">
<style>
  .entrar-tela { min-height:100vh; display:grid; place-items:center; padding:24px; }
  .entrar-caixa { width:100%; max-width:380px; background:#0f172a;
    border:1px solid var(--glass-border); border-radius:14px; padding:28px; }
  .entrar-marca { display:flex; align-items:center; gap:9px; margin-bottom:22px; }
  .entrar-marca span { font-size:17px; font-weight:700; letter-spacing:-.01em; }
  .entrar-caixa label { display:block; font-size:12px; color:var(--text-secondary);
    text-transform:uppercase; letter-spacing:.05em; margin-bottom:7px; }
  .entrar-caixa input { width:100%; padding:11px 13px; background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.15); border-radius:8px; color:#fff; font-size:14px; }
  .entrar-caixa input:focus { outline:none; border-color:var(--glass-border-hover); }
  .entrar-caixa button { width:100%; margin-top:16px; padding:11px; border:none; border-radius:8px;
    background:#2563eb; color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  .entrar-caixa button:disabled { opacity:.55; cursor:default; }
  .entrar-aviso { margin-top:16px; padding:10px 12px; border-radius:8px; font-size:12.5px;
    line-height:1.5; border:1px solid rgba(248,113,113,.35); border-left-width:3px;
    background:rgba(248,113,113,.08); color:#fca5a5; }
  .entrar-rodape { margin-top:20px; font-size:12px; color:var(--text-secondary); line-height:1.6; }
</style>
</head>
<body>
<div class="entrar-tela">
  <div class="entrar-caixa">
    <div class="entrar-marca">
      <svg width="26" height="26" viewBox="0 0 100 100" fill="none">
        <defs><linearGradient id="g" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#2563eb"/>
        </linearGradient></defs>
        <path d="M42 12 H58 L80 88 H66 L66 48 H57 L57 88 H43 L43 48 H34 L34 88 H20 Z" fill="url(#g)"/>
      </svg>
      <span>AudaSys Canvas</span>
    </div>

    <div id="area-erro"></div>

    <form id="form-entrar">
      <label for="chave">Chave de administrador</label>
      <input type="password" id="chave" autocomplete="current-password" autofocus>
      <button type="submit" id="btn-entrar">Entrar</button>
    </form>

    <p class="entrar-rodape">
      Se você é cliente da consultoria, use o link de acesso que recebeu — ele entra direto,
      sem senha.
    </p>
  </div>
</div>
<script>
const erro = (msg) => {
  document.getElementById('area-erro').innerHTML = `<div class="entrar-aviso">${msg}</div>`;
};

// Link inválido ou revogado cai aqui pelo redirect de /e/<token>.
if (new URLSearchParams(location.search).get('erro') === 'link') {
  erro('Esse link de acesso não é mais válido. Peça um novo à consultoria.');
}

// Já tem sessão? Não faz sentido pedir a chave de novo.
fetch('/api/sessao').then(r => r.json()).then(s => {
  if (s.autenticado) location.href = '/';
}).catch(() => {});

document.getElementById('form-entrar').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn-entrar');
  btn.disabled = true;
  btn.textContent = 'Entrando…';
  try {
    const r = await fetch('/api/entrar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chave: document.getElementById('chave').value }),
    });
    if (!r.ok) {
      const { error } = await r.json().catch(() => ({}));
      throw new Error(error || 'Não foi possível entrar.');
    }
    location.href = '/';
  } catch (err) {
    erro(err.message);
    btn.disabled = false;
    btn.textContent = 'Entrar';
    document.getElementById('chave').select();
  }
});
</script>
</body>
</html>
