<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audasys Canvas — Entrar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="entrar-tela">
  <div class="entrar-caixa">
    <div class="entrar-marca">
      <svg width="26" height="26" viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <defs><linearGradient id="g" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#2563eb"/>
        </linearGradient></defs>
        <path d="M42 12 H58 L80 88 H66 L66 48 H57 L57 88 H43 L43 48 H34 L34 88 H20 Z" fill="url(#g)"/>
      </svg>
      <span>AudaSys Canvas</span>
    </div>

    <div class="entrar-abas" role="tablist">
      <button class="entrar-aba" id="aba-admin" role="tab" data-aba="admin">Entrar como Admin</button>
      <button class="entrar-aba" id="aba-cliente" role="tab" data-aba="cliente">Entrar como Cliente</button>
    </div>

    <div id="area-erro"></div>

    <form id="form-admin" class="entrar-painel">
      <label for="chave">Chave de administrador</label>
      <input type="password" id="chave" autocomplete="current-password">
      <button type="submit" class="entrar-botao">Entrar</button>
      <p class="entrar-rodape">Acesso da consultoria. Vê todas as empresas.</p>
    </form>

    <form id="form-cliente" class="entrar-painel">
      <label for="empresa">Empresa</label>
      <input type="text" id="empresa" autocomplete="organization" spellcheck="false"
             placeholder="Nome da sua empresa">

      <label for="codigo" style="margin-top:14px;">Senha</label>
      <input type="password" id="codigo" autocomplete="current-password" spellcheck="false"
             placeholder="Cole aqui o link que você recebeu">

      <button type="submit" class="entrar-botao">Entrar</button>
      <button type="button" class="entrar-link" id="btn-esqueci">Esqueci o link de acesso</button>
      <p class="entrar-rodape">
        A senha é o link que a consultoria enviou — pode colar inteiro. Você verá apenas
        os processos da sua empresa.
      </p>
    </form>

    <form id="form-recuperar" class="entrar-painel">
      <label for="rec-empresa">Empresa</label>
      <input type="text" id="rec-empresa" autocomplete="organization" placeholder="Nome da sua empresa">
      <button type="submit" class="entrar-botao">Pedir um link novo</button>
      <button type="button" class="entrar-link" id="btn-voltar-login">Voltar</button>
      <p class="entrar-rodape">
        O pedido chega direto para a consultoria, que envia um link novo. O anterior
        deixa de valer.
      </p>
    </form>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const erro = (msg) => { $('area-erro').innerHTML = msg ? `<div class="entrar-aviso">${msg}</div>` : ''; };

/**
 * Extrai o código de acesso do que foi colado.
 *
 * Tolerante de propósito: o link chega por WhatsApp e volta com espaço em volta,
 * quebra de linha no meio, `?` de parâmetro colado atrás, às vezes a URL inteira
 * e às vezes só o código. Recusar por causa de um espaço é transformar um
 * problema de formatação num telefonema para o consultor.
 */
function extrairCodigo(bruto) {
  const texto = String(bruto || '').trim().replace(/\s+/g, '');
  if (!texto) return null;
  const naUrl = texto.match(/\/e\/([A-Za-z0-9_-]{20,})/);
  if (naUrl) return naUrl[1];
  // Código puro: 32 bytes em base64url dão 43 caracteres.
  if (/^[A-Za-z0-9_-]{20,}$/.test(texto)) return texto;
  return null;
}

// ── Abas ──────────────────────────────────────────────────────────────────────
const LEMBRANCA = 'audasys.abaLogin';
function mostrarAba(qual) {
  for (const nome of ['admin', 'cliente']) {
    const ativa = nome === qual;
    $(`aba-${nome}`).classList.toggle('ativa', ativa);
    $(`aba-${nome}`).setAttribute('aria-selected', String(ativa));
    $(`form-${nome}`).classList.toggle('ativo', ativa);
  }
  // A recuperação é um terceiro painel sem aba: só se chega nela pelo link, e
  // trocar de aba tem que trazer de volta ao formulário normal.
  $('form-recuperar').classList.remove('ativo');
  try { localStorage.setItem(LEMBRANCA, qual); } catch { /* aba anônima */ }
  $(qual === 'admin' ? 'chave' : 'empresa').focus();
}

function mostrarRecuperacao(mostrar) {
  $('form-cliente').classList.toggle('ativo', !mostrar);
  $('form-recuperar').classList.toggle('ativo', mostrar);
  if (mostrar) {
    $('rec-empresa').value = $('empresa').value;
    $('rec-empresa').focus();
  }
}
document.querySelectorAll('.entrar-aba').forEach((b) => {
  b.addEventListener('click', () => { erro(''); mostrarAba(b.dataset.aba); });
});

// Prioridade: o que a URL pede > o que o navegador lembra > admin.
const params = new URLSearchParams(location.search);
let inicial = params.get('aba');
if (!['admin', 'cliente'].includes(inicial)) {
  try { inicial = localStorage.getItem(LEMBRANCA); } catch { inicial = null; }
}
mostrarAba(['admin', 'cliente'].includes(inicial) ? inicial : 'admin');

// Já tem sessão? Não faz sentido pedir credencial de novo.
fetch('/api/sessao').then((r) => r.json()).then((s) => { if (s.autenticado) location.href = '/'; })
  .catch(() => {});

// ── Admin ─────────────────────────────────────────────────────────────────────
$('form-admin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    const r = await fetch('/api/entrar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chave: $('chave').value }),
    });
    if (!r.ok) {
      const { error } = await r.json().catch(() => ({}));
      throw new Error(error || 'Não foi possível entrar.');
    }
    location.href = '/';
  } catch (err) {
    erro(err.message);
    btn.disabled = false; btn.textContent = 'Entrar';
    $('chave').select();
  }
});

// ── Cliente ───────────────────────────────────────────────────────────────────
/**
 * Quem chegou pelo link já tem a senha: ela veio num cookie de vida curta que o
 * `/e/<token>` gravou. Buscá-la aqui, e não pela URL, é o que mantém o código
 * fora da barra de endereços — de onde vazaria em print, histórico e `Referer`.
 */
fetch('/api/senha-pendente').then((r) => r.json()).then(({ senha }) => {
  if (!senha) return;
  $('codigo').value = senha;
  mostrarAba('cliente');
  $('empresa').focus();
}).catch(() => {});

$('form-cliente').addEventListener('submit', async (e) => {
  e.preventDefault();
  const empresa = $('empresa').value.trim();
  const codigo = extrairCodigo($('codigo').value);

  // Erro de formato é diferente de credencial recusada, e dizer qual dos dois
  // permite a pessoa se corrigir sozinha em vez de ligar para o consultor.
  if (!empresa) { erro('Informe o nome da sua empresa.'); $('empresa').focus(); return; }
  if (!codigo) {
    erro('Não reconheci um link de acesso no campo de senha. Cole a URL inteira que '
       + 'você recebeu, ou apenas o código que vem depois de <code>/e/</code>.');
    $('codigo').select();
    return;
  }

  const btn = e.target.querySelector('button');
  btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    const r = await fetch('/api/entrar-cliente', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ empresa, senha: codigo }),
    });
    if (!r.ok) {
      const corpo = await r.json().catch(() => ({}));
      // Bloqueio não é erro de digitação: quem não distingue os dois tenta de novo.
      throw new Error(corpo.error || 'Não foi possível entrar.');
    }
    location.href = '/';
  } catch (err) {
    erro(err.message);
    btn.disabled = false; btn.textContent = 'Entrar';
  }
});

// ── Recuperação ───────────────────────────────────────────────────────────────
$('btn-esqueci').addEventListener('click', () => { erro(''); mostrarRecuperacao(true); });
$('btn-voltar-login').addEventListener('click', () => { erro(''); mostrarRecuperacao(false); });

$('form-recuperar').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    const r = await fetch('/api/recuperar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ empresa: $('rec-empresa').value.trim() }),
    });
    const { mensagem } = await r.json().catch(() => ({}));
    // A resposta é a mesma exista a empresa ou não — senão esta tela vira
    // consulta de quem é cliente da consultoria.
    $('form-recuperar').innerHTML = `<p class="entrar-rodape" style="margin:0;">
      <i style="color:#34d399;">✓</i> ${mensagem || 'Pedido registrado.'}
      Você pode fechar esta página.</p>`;
  } catch {
    erro('Não foi possível registrar o pedido agora. Tente de novo em instantes.');
    btn.disabled = false; btn.textContent = 'Pedir um link novo';
  }
});
</script>
</body>
</html>
